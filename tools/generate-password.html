<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generate Admin Password Hash</title><body style="font:16px system-ui;max-width:650px;margin:50px auto;padding:20px;background:#fffaf6;color:#493b42"><h1>Generate initial admin credential</h1><p>Jalankan file ini secara lokal di perangkatmu. Password tidak dikirim ke internet. Gunakan password unik minimal 12 karakter.</p><label>Password baru<br><input id="p" type="password" style="padding:12px;width:95%;margin:10px 0"></label><button id="go" style="padding:12px 20px">Generate hash</button><pre id="out" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f5e8ed;padding:15px;border-radius:10px"></pre><script>
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
document.querySelector('#go').onclick=async()=>{const p=document.querySelector('#p').value;if(p.length<12){alert('Gunakan minimal 12 karakter.');return}const salt=b64(crypto.getRandomValues(new Uint8Array(24)));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:310000,hash:'SHA-256'},key,256);document.querySelector('#out').textContent=`INSERT INTO public.admin_credentials(id,password_salt,password_hash) VALUES (1,'${salt}','${b64(bits)}') ON CONFLICT(id) DO UPDATE SET password_salt=EXCLUDED.password_salt,password_hash=EXCLUDED.password_hash,updated_at=now();\n\nCopy SQL above to Supabase SQL Editor and run it. Keep the generated values private.`;document.querySelector('#p').value=''};
</script></body></html>
